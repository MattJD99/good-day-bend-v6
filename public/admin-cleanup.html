<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDB Daily Updates Cleanup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f7f9f8;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>

<body class="p-10">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Daily Updates Cleanup Tool</h1>

        <div class="mb-8 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
            <h2 class="font-bold text-yellow-800 mb-2">⚠ Warning</h2>
            <p class="text-yellow-800 text-sm">This tool will verify and perform write operations on the Firestore
                database. Use with caution.</p>
        </div>

        <div class="flex gap-4 mb-8">
            <button id="scan-btn"
                class="px-6 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">
                1. Scan Documents
            </button>
            <button id="run-btn"
                class="px-6 py-3 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 transition opacity-50 cursor-not-allowed"
                disabled>
                2. Execute Cleanup
            </button>
        </div>

        <div id="status" class="mb-4 font-mono text-sm text-gray-600"></div>

        <div class="grid grid-cols-2 gap-8">
            <div>
                <h3 class="font-bold mb-3">Proposed "Good Day Bend" Removals</h3>
                <div id="list-removals" class="h-96 overflow-y-auto bg-gray-50 border rounded p-4 text-xs font-mono">
                    <p class="text-gray-400 italic">No scan results yet...</p>
                </div>
            </div>
            <div>
                <h3 class="font-bold mb-3">Proposed Title Renames ("Festive")</h3>
                <div id="list-renames" class="h-96 overflow-y-auto bg-gray-50 border rounded p-4 text-xs font-mono">
                    <p class="text-gray-400 italic">No scan results yet...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let pendingUpdates = [];

        async function scanDocuments() {
            const status = document.getElementById('status');
            const listRemovals = document.getElementById('list-removals');
            const listRenames = document.getElementById('list-renames');

            status.textContent = "Scanning 'daily_updates' collection...";
            listRemovals.innerHTML = '';
            listRenames.innerHTML = '';
            pendingUpdates = [];

            try {
                const querySnapshot = await getDocs(collection(db, "daily_updates"));
                let removalCount = 0;
                let renameCount = 0;

                querySnapshot.forEach((docSnapshot) => {
                    const data = docSnapshot.data();
                    let needsUpdate = false;
                    let newTitle = data.title;
                    let newContent = data.content;

                    // 1. Check for "Good Day Bend:" removal
                    let reason = "";
                    if (newTitle && newTitle.match(/^Good Day Bend:\s*/i)) {
                        newTitle = newTitle.replace(/^Good Day Bend:\s*/i, "").trim();
                        needsUpdate = true;
                        reason += "[Title Trim] ";
                    }
                    if (newContent && newContent.match(/^Good Day Bend:\s*/i)) {
                        // Very rudimentary content cleanup, safer to just handle titles for now unless sure
                        // newContent = newContent.replace(/^Good Day Bend:\s*/i, "").trim();
                        // needsUpdate = true;
                    }

                    // 2. Check for "Festive" rename
                    if (newTitle && newTitle.toLowerCase().includes('festive')) {
                        // Extract date from ID if pattern matches daily-YYYY-MM-DD
                        let dateSuffix = "";
                        if (docSnapshot.id.startsWith('daily-')) {
                            dateSuffix = " - " + docSnapshot.id.replace('daily-', '');
                        }

                        newTitle = "Daily Update" + dateSuffix;
                        needsUpdate = true;
                        renameCount++;

                        const el = document.createElement('div');
                        el.className = "mb-2 pb-2 border-b border-gray-200";
                        el.innerHTML = `<span class="text-red-500">${data.title}</span> <br> ⬇ <br> <span class="text-green-600 font-bold">${newTitle}</span>`;
                        listRenames.appendChild(el);
                    }
                    else if (reason.includes("Title Trim")) {
                        removalCount++;
                        const el = document.createElement('div');
                        el.className = "mb-2 pb-2 border-b border-gray-200";
                        el.innerHTML = `<span class="text-red-500">${data.title}</span> <br> ⬇ <br> <span class="text-green-600 font-bold">${newTitle}</span>`;
                        listRemovals.appendChild(el);
                    }

                    if (needsUpdate) {
                        pendingUpdates.push({
                            ref: docSnapshot.ref,
                            data: { title: newTitle }
                        });
                    }
                });

                status.innerHTML = `Scan Complete. Found <b>${pendingUpdates.length}</b> documents needing updates.<br>
                                    (Removals: ${removalCount}, Renames: ${renameCount})`;

                if (pendingUpdates.length > 0) {
                    const runBtn = document.getElementById('run-btn');
                    runBtn.disabled = false;
                    runBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }

            } catch (e) {
                console.error(e);
                status.textContent = "Error scanning: " + e.message;
            }
        }

        async function executeCleanup() {
            if (pendingUpdates.length === 0) return;
            const status = document.getElementById('status');
            status.textContent = "Executing batch updates...";

            const BATCH_SIZE = 400; // Firestore limit is 500
            let batch = writeBatch(db);
            let operationCount = 0;
            let totalCommitted = 0;

            try {
                for (const update of pendingUpdates) {
                    batch.update(update.ref, update.data);
                    operationCount++;

                    if (operationCount >= BATCH_SIZE) {
                        await batch.commit();
                        totalCommitted += operationCount;
                        status.textContent = `Committed ${totalCommitted} updates...`;
                        batch = writeBatch(db); // new batch
                        operationCount = 0;
                    }
                }

                if (operationCount > 0) {
                    await batch.commit();
                    totalCommitted += operationCount;
                }

                status.innerHTML = `<span class="text-green-600 font-bold">Success! Updated ${totalCommitted} documents. Refresh the page to verify.</span>`;
                document.getElementById('run-btn').disabled = true;
                document.getElementById('run-btn').classList.add('opacity-50');

            } catch (e) {
                console.error(e);
                status.textContent = "Error executing batch cleanup: " + e.message;
            }
        }

        document.getElementById('scan-btn').addEventListener('click', scanDocuments);
        document.getElementById('run-btn').addEventListener('click', executeCleanup);
    </script>
</body>

</html>
